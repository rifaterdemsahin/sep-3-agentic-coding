<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
  // Canonical host is Cloudflare Workers; GitHub Pages forwards visitors with repo subpath cleaned.
  if(location.hostname.endsWith('github.io')){
    var cleanPath = location.pathname.replace(/^\/sep-3-agentic-coding/, '').replace(/^\/[^/]+(?=\/html\/)/, '');
    if(!cleanPath.startsWith('/')) cleanPath = '/' + cleanPath;
    location.replace('https://sep-3-agentic-coding.polished-boat-17b2.workers.dev' + cleanPath + location.search + location.hash);
  }
</script>
<title>🗣️ Plain English Review — Task Decomposition</title>
<link rel="stylesheet" href="../css/shared.css">
<style>
  header{ padding:48px 24px 24px; max-width:1000px; margin:0 auto; text-align:center; }
  header .eyebrow{ color:var(--accent); letter-spacing:.14em; text-transform:uppercase; font-size:12px; font-weight:600; }
  header h1{ font-size:clamp(24px,4vw,38px); margin:10px 0 12px; font-weight:700; }
  header p.sub{ color:var(--text-dim); max-width:640px; margin:0 auto; font-size:15px; }

  main{ max-width:1000px; margin:0 auto; padding:0 24px 90px; }

  .layman-intro{
    margin:0 0 28px;
    padding:18px 22px;
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-left:4px solid var(--warm);
    border-radius:12px;
  }
  .layman-intro h2{ margin:0 0 8px; font-size:15px; }
  .layman-intro p{ margin:0; color:var(--text-dim); font-size:13.5px; line-height:1.6; }
  .layman-intro a{ color:var(--accent-2); text-decoration:none; }
  .layman-intro a:hover{ text-decoration:underline; }

  .ba-beat{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:12px;
    padding:20px 22px;
    margin-bottom:22px;
  }
  .ba-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:14px;
  }
  .ba-head h2{ margin:0; font-size:16px; }
  .ba-head .tc{
    font-size:11.5px;
    font-weight:700;
    color:var(--text-dim);
    background:rgba(255,255,255,.04);
    border:1px solid var(--panel-border);
    padding:2px 10px;
    border-radius:999px;
  }
  .ba-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }
  @media (max-width:720px){
    .ba-grid{ grid-template-columns:1fr; }
  }
  .ba-col{
    border-radius:10px;
    padding:14px 16px;
  }
  .ba-col.before{
    background:rgba(90,176,255,.05);
    border:1px solid rgba(90,176,255,.25);
  }
  .ba-col.after{
    background:rgba(232,185,74,.06);
    border:1px solid rgba(232,185,74,.3);
  }
  .ba-col-label{
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.06em;
    margin-bottom:8px;
  }
  .ba-col.before .ba-col-label{ color:var(--accent-2); }
  .ba-col.after .ba-col-label{ color:var(--warm); }
  .ba-col p{ margin:0 0 10px; font-size:13.5px; line-height:1.6; color:var(--text); }
  .ba-col p:last-child{ margin-bottom:0; }

  .ba-swaps{
    margin-top:14px;
    padding-top:12px;
    border-top:1px solid var(--panel-border);
    font-size:12.5px;
    color:var(--text-dim);
  }
  .ba-swaps b{ color:var(--text); }
  .ba-swaps ul{ margin:6px 0 0; padding-left:18px; }
  .ba-swaps li{ margin-bottom:3px; }

  footer{
    max-width:1000px; margin:0 auto; padding:24px; text-align:center;
    color:var(--text-dim); font-size:12.5px; border-top:1px solid var(--panel-border);
  }
  footer a{color:var(--accent-2);text-decoration:none;}
  footer a:hover{text-decoration:underline;}
</style>
<script src="../js/video-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/nav.js"></script>
<script src="../js/content-db.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/notes.js"></script>
</head>
<body>

<div id="nav-mount"></div>
<script>Nav.render('plain-english');</script>

<header>
  <div class="eyebrow">⚖️ Evaluate · Layman's Terms Pass</div>
  <h1>Plain English Review</h1>
  <p class="sub">Before &amp; after — the read-aloud script rewritten to strip jargon, idioms, and stacked clauses so any viewer gets it on the first listen.</p>
</header>

<main>
  <div class="layman-intro" id="layman-intro-mount"></div>
  <div id="ba-container"></div>
</main>

<footer>
  See the full script at 📝 <a href="script.html">Script</a>.
</footer>

<script>
  function renderIntro(){
    var rows = ContentDB.getBlocks('plain-english.html', 'intro');
    if(!rows.length) return;
    var d = rows[0].data;
    document.getElementById('layman-intro-mount').innerHTML =
      '<h2>' + d.title + '</h2>' +
      '<p>' + d.body + '</p>';
  }

  function renderBeats(){
    var beats = ContentDB.getBlocks('plain-english.html', 'beats');
    document.getElementById('ba-container').innerHTML = beats.map(function(b){
      var d = b.data;
      var before = d.before.map(function(p){ return '<p>' + p + '</p>'; }).join('');
      var after = d.after.map(function(p){ return '<p>' + p + '</p>'; }).join('');
      var swaps = (d.swaps || []).map(function(s){ return '<li>' + s + '</li>'; }).join('');
      return '<section class="ba-beat" id="' + d.sectionId + '">' +
        '<div class="ba-head">' +
          '<h2>' + d.title + '</h2>' +
          '<span class="tc">' + d.tc + '</span>' +
        '</div>' +
        '<div class="ba-grid">' +
          '<div class="ba-col before">' +
            '<div class="ba-col-label">Before</div>' +
            before +
          '</div>' +
          '<div class="ba-col after">' +
            '<div class="ba-col-label">After</div>' +
            after +
          '</div>' +
        '</div>' +
        (swaps ? '<div class="ba-swaps"><b>🔄 What changed:</b><ul>' + swaps + '</ul></div>' : '') +
      '</section>';
    }).join('');
  }

  ContentDB.ready.then(function(){
    renderIntro();
    renderBeats();
  });
</script>
</body>
</html>
